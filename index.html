<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEEX — Coming soon</title>
  <meta name="description" content="VEEX — Coming soon.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="VEEX — Coming soon">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:url" content="https://veexapp.com">
  <meta property="og:image" content="https://veexapp.com/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #141414;
      --text: #ffffff;
      --text2: #aaaaaa;
      --text3: #666666;
      --border: #2a2a2a;
      --purple: #7C3AED;
      --green: #00C389;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* brillo morado de fondo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 38%, rgba(124, 58, 237, 0.18), transparent 55%);
      pointer-events: none;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 16px 40px;
      position: relative;
    }
    .logo {
      font-family: 'Archivo', 'Jost', sans-serif;
      font-weight: 900;
      font-size: clamp(72px, 18vw, 140px);
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .logo span {
      display: inline-block;
      width: 0.2em;
      height: 0.2em;
      margin-left: 0.06em;
      background: var(--purple);
      box-shadow: 0 0 24px rgba(124, 58, 237, 0.7);
    }
    .soon {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--green);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 16px;
    }
    .soon::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--green);
      animation: blink 1.4s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    .links {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid var(--border);
      background: var(--bg2);
      padding: 12px 20px;
      transition: border-color 0.15s, background 0.15s;
    }
    .links a:hover { border-color: var(--purple); background: #1a1426; }
    .links svg { width: 18px; height: 18px; fill: currentColor; }
    footer {
      text-align: center;
      color: var(--text3);
      font-size: 12px;
      padding: 24px 16px 32px;
      position: relative;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">VEEX<span></span></div>

    <div class="soon"><b>Coming soon</b></div>

    <div class="links">
      <a href="https://instagram.com/veexapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 2.2c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.3.8-.4.4-.6.8-.8 1.3-.2.4-.3 1-.4 2.1-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.3.4.4.8.6 1.3.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.3-.8.4-.4.6-.8.8-1.3.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.3-.4-.4-.8-.6-1.3-.8-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.4a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4zm0 6.9a2.7 2.7 0 1 0 0-5.4 2.7 2.7 0 0 0 0 5.4zm5.3-7.1a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>
        @veexapp
      </a>
      <a href="mailto:hello@veexapp.com">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h20v14H2V5zm2 2v.5l8 5 8-5V7H4zm16 2.8-8 5-8-5V17h16V9.8z"/></svg>
        hello@veexapp.com
      </a>
    </div>
  </main>

  <footer>
    © <span id="year">2026</span> VEEX
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear()
  </script>
</body>
</html>
